# Render Deployment Configuration
# Web service only — PostgreSQL is hosted on Supabase

services:
  - type: web
    name: lao-python-learn
    env: python
    pythonVersion: "3.12"
    buildCommand: "pip install --no-cache-dir --only-binary=:all: -r requirements.txt"
    startCommand: "python app.py --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: ""  # Set this in Render dashboard from Supabase connection string
