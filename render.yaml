# Render Deployment Configuration
# Create this file in your project root for Render auto-detection

---
# render.yaml
services:
  - type: web
    name: lao-python-learn
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gradio app.py --server.port $PORT --server.host 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
