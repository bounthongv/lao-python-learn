# Render Deployment Configuration
# Create this file in your project root for Render auto-detection

---
# render.yaml
services:
  - type: web
    name: lao-python-learn
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: lao-python-learn-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: lao-python-learn-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: lao-python-learn-db
          property: databaseName
      - key: DB_USER
        fromDatabase:
          name: lao-python-learn-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: lao-python-learn-db
          property: password

databases:
  - name: lao-python-learn-db
    databaseName: lao_python_learn
    user: lao_user
    plan: free
