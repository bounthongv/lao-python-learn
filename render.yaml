# Render Deployment Configuration
# Web service only — PostgreSQL is hosted on Supabase

services:
  - type: web
    name: lao-python-learn
    runtime: python
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "python app.py --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard from Supabase connection string
